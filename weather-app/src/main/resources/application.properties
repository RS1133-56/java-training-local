spring.application.name=weather-app

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/weather_app?useSSL=false&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 接続プール設定
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
# データベース初期化
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Server Configuration
# ポート番号変更
server.port=8080
# コンテキストパス（アプリケーションのルートパス）
server.servlet.context-path=/

# セッションタイムアウト（秒）
server.servlet.session.timeout=1800

# 最大HTTPヘッダーサイズ
server.max-http-header-size=8KB

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
# DDL自動生成モード
# none: 何もしない
# validate: スキーマを検証のみ
# update: スキーマを更新（本番非推奨）
# create: 起動時にスキーマを作成（既存データ削除）
# create-drop: 終了時にスキーマを削除
spring.jpa.hibernate.ddl-auto=update
# SQL出力
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ネーミング戦略
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.com.example.weatherapp=DEBUG
# ログレベル（TRACE, DEBUG, INFO, WARN, ERROR）
logging.level.root=INFO
logging.level.com.example.weatherapp=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# ログファイル出力
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=30

